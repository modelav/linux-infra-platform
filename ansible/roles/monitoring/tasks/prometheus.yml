---
- name: Install prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  become: true

- name: Deploy Prometheus alert rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/prometheus/rules/{{ item | basename }}"
    owner: prometheus
    group: prometheus
    mode: "0644"
    validate: "/usr/bin/promtool check rules %s"
  loop: "{{ lookup('ansible.builtin.fileglob', role_path + '/files/alerts/*.yml', wantlist=True) }}"
  become: true
  notify: Restart prometheus

- name: Configure prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: "/usr/bin/promtool check config %s"
  become: true
  notify: Restart prometheus

- name: Ensure prometheus is running and enabled
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
  become: true

- name: Verify Prometheus is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_prometheus_port }}/-/ready"
    method: GET
    status_code: 200
  register: monitoring_prometheus_readiness
  until: monitoring_prometheus_readiness.status == 200
  retries: 12
  delay: 5
  become: true
