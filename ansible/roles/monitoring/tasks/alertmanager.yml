---
- name: Create Alertmanager system user
  ansible.builtin.user:
    name: alertmanager
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/alertmanager
    create_home: false
  become: true

- name: Create Alertmanager data directory
  ansible.builtin.file:
    path: /var/lib/alertmanager
    state: directory
    owner: alertmanager
    group: alertmanager
    mode: "0750"
  become: true

- name: Download Alertmanager
  ansible.builtin.get_url:
    url:
      "https://github.com/prometheus/alertmanager/releases/download/v{{ monitoring_alertmanager_version }}/\
      alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp/alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64.tar.gz"
    mode: "0644"
  become: true

- name: Extract Alertmanager
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  become: true

- name: Move Alertmanager binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64/alertmanager"
    dest: /usr/local/bin/alertmanager
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Install amtool binary
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ monitoring_alertmanager_version }}.linux-amd64/amtool"
    dest: /usr/local/bin/amtool
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Create Alertmanager configuration directory
  ansible.builtin.file:
    path: /etc/alertmanager
    state: directory
    owner: root
    group: alertmanager
    mode: "0750"
  become: true

- name: Configure Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: root
    group: alertmanager
    mode: "0640"
    validate: "/usr/local/bin/amtool check-config %s"
  become: true
  notify: Restart alertmanager

- name: Install alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Start and enable Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Verify Alertmanager is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_alertmanager_port }}/-/ready"
    method: GET
    status_code: 200
  register: monitoring_alertmanager_readiness
  until: monitoring_alertmanager_readiness.status == 200
  retries: 12
  delay: 5
  become: true

- name: Create Alertmanager Slack webhook secret file
  ansible.builtin.copy:
    content: "{{ monitoring_alertmanager_slack_webhook_url }}\n"
    dest: /etc/alertmanager/slack_webhook
    owner: root
    group: alertmanager
    mode: "0640"
  become: true
  no_log: true
  notify: Restart alertmanager
