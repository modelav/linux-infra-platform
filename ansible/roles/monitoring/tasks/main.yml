---
- name: Install prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  become: true

- name: Copy alert rules
  ansible.builtin.copy:
    src: instance-down.yml
    dest: /etc/prometheus/rules/instance-down.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  become: true
  notify: Restart prometheus

- name: Configure prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
  become: true
  notify: Restart prometheus

- name: Ensure prometheus is running and enabled
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
  become: true

- name: Allow Grafana through ufw
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp
  become: true

- name: Install APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - python3-debian
    state: present
    update_cache: true
  become: true

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types:
      - deb
    uris:
      - https://apt.grafana.com
    suites:
      - stable
    components:
      - main
    signed_by: https://apt.grafana.com/gpg-full.key
    state: present
  become: true

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Provision Grafana datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  become: true
  notify: Restart grafana

- name: Provision Grafana dashboard provider config
  ansible.builtin.copy:
    src: dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yml
    owner: root
    group: grafana
    mode: "0640"
  become: true
  notify: Restart grafana

- name: Provision Grafana dashboard
  ansible.builtin.copy:
    src: node-overview.json
    dest: /etc/grafana/provisioning/dashboards/node-overview.json
    owner: root
    group: grafana
    mode: "0640"
  become: true
  notify: Restart grafana

- name: Ensure Grafana provisioning directory exists
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: grafana
    mode: "0755"
  become: true

- name: Ensure Grafana is running and enabled
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true
  become: true

- name: Allow Loki through ufw
  community.general.ufw:
    rule: allow
    port: "3100"
    proto: tcp
    from_ip: "10.0.0.0/16"
  become: true

- name: Download Loki
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v3.0.0/loki-linux-amd64.zip"
    dest: /tmp/loki.zip
    mode: "0644"
  become: true

- name: Install unzip
  ansible.builtin.apt:
    name: unzip
    state: present
  become: true

- name: Extract loki
  ansible.builtin.unarchive:
    src: /tmp/loki.zip
    dest: /usr/local/bin
    remote_src: true
  become: true

- name: Create loki config directory
  ansible.builtin.file:
    path: /etc/loki
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure loki
  ansible.builtin.template:
    src: loki-config.yml.j2
    dest: /etc/loki/loki-config.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart loki

- name: Install loki systemd service
  ansible.builtin.template:
    src: loki.service.j2
    dest: /etc/systemd/system/loki.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Start and enabled loki
  ansible.builtin.systemd:
    name: loki
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Download Alertmanager
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz"
    dest: /tmp/alertmanager.tar.gz
    mode: "0644"
  become: true

- name: Extract Alertmanager
  ansible.builtin.unarchive:
    src: /tmp/alertmanager.tar.gz
    dest: /tmp
    remote_src: true
  become: true

- name: Move Alertmanager binary
  ansible.builtin.copy:
    src: /tmp/alertmanager-0.27.0.linux-amd64/alertmanager
    dest: /usr/local/bin/alertmanager
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Create Alertmanager config directory
  ansible.builtin.file:
    path: /etc/alertmanager
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure Alertmanager
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart alertmanager

- name: Install alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Start and enable Alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
  become: true
