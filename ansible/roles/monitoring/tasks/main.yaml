---
- name: Install prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Configure prometheus
  ansible.builtin.template:
    src: prometheus.yaml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
  become: true
  notify: Restart prometheus

- name: Ensure prometheus is running and enabled
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true
  become: true

- name: Allow Grafana through ufw
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp
  become: true

- name: Install APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - python3-debian
    state: present
    update_cache: true
  become: true

- name: Add Grafana APT repository
  ansible.builtin.deb822_repository:
    name: grafana
    types:
      - deb
    uris:
      - https://apt.grafana.com
    suites:
      - stable
    components:
      - main
    signed_by: https://apt.grafana.com/gpg-full.key
    state: present
  become: true

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
  become: true

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Provision Grafana datasource
  ansible.builtin.template:
    src: datasource.yaml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yaml
    owner: root
    group: grafana
    mode: "0640"
  become: true

- name: Provision Grafana dashboard provider config
  ansible.builtin.copy:
    src: dashboards.yaml
    dest: /etc/grafana/provisioning/dashboards/dashboards.yaml
    owner: root
    group: grafana
    mode: "0640"
  become: true

- name: Provision Grafana dashboard
  ansible.builtin.copy:
    src: node-overview.json
    dest: /etc/grafana/provisioning/dashboards/node-overview.json
    owner: root
    group: grafana
    mode: "0640"
  become: true

- name: Ensure Grafana provisioning directory exists
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: grafana
    mode: "0755"
  become: true

- name: Ensure Grafana is running and enabled
  ansible.builtin.service:
    name: grafana-server
    state: started
    enabled: true
  become: true
