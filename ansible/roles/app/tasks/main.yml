---
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Add admin user to docker group
  ansible.builtin.user:
    name: admin
    groups: docker
    append: true
  become: true

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Allow HTTP through ufw
  community.general.ufw:
    rule: allow
    port: "80"
    proto: "tcp"
  become: true

- name: Pull nginx image
  community.docker.docker_image:
    name: nginx:alpine
    source: pull
  become: true

- name: Run nginx container
  community.docker.docker_container:
    name: web-app
    image: nginx:alpine
    state: started
    restart_policy: unless-stopped
    ports:
      - "80:80"
  become: true

- name: Create app secret directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: admin
    group: admin
    mode: "0750"
  become: true

- name: Write app secret to file
  ansible.builtin.template:
    src: env.j2
    dest: /opt/app/.env
    owner: admin
    group: admin
    mode: "0600"
  become: true

- name: Allow Node Exporter metrics from monitoring server
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    from_ip: "{{ monitoring_server_private_ip }}"
  become: true

- name: Download Node Exporter
  ansible.builtin.get_url:
    url:
      "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/\
      node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    mode: "0644"
  become: true

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  become: true

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
  become: true

- name: Install node exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Start and enable node exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Download Grafana Alloy package
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ alloy_version }}/alloy-{{ alloy_version }}-1.amd64.deb"
    dest: "/tmp/alloy-{{ alloy_version }}-1.amd64.deb"
    mode: "0644"
  become: true

- name: Install Grafana Alloy
  ansible.builtin.apt:
    deb: "/tmp/alloy-{{ alloy_version }}-1.amd64.deb"
    state: present
  become: true

- name: Ensure Alloy is a member of the required log-reading groups
  ansible.builtin.user:
    name: alloy
    groups:
      - adm
      - systemd-journal
    append: true
  become: true

- name: Ensure Alloy configuration directory exists
  ansible.builtin.file:
    path: "{{ alloy_config_dir }}"
    state: directory
    owner: root
    group: alloy
    mode: "0750"
  become: true

- name: Ensure Alloy data directory exists
  ansible.builtin.file:
    path: "{{ alloy_data_dir }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"
  become: true

- name: Configure Grafana Alloy
  ansible.builtin.template:
    src: alloy.config.alloy.j2
    dest: "{{ alloy_config_file }}"
    owner: root
    group: alloy
    mode: "0640"
    validate: "/usr/bin/alloy validate %s"
  become: true
  notify: Restart Alloy

- name: Ensure Alloy service is running and enabled
  ansible.builtin.systemd_service:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
  become: true
