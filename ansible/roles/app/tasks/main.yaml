---
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Add admin user to docker group
  ansible.builtin.user:
    name: admin
    groups: docker
    append: true
  become: true

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Allow HTTP through ufw
  community.general.ufw:
    rule: allow
    port: "80"
    proto: "tcp"
  become: true

- name: Pull nginx image
  community.docker.docker_image:
    name: nginx:alpine
    source: pull
  become: true

- name: Run nginx container
  community.docker.docker_container:
    name: web-app
    image: nginx:alpine
    state: started
    restart_policy: unless-stopped
    ports:
      - "80:80"
  become: true

- name: Create app secret directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: admin
    group: admin
    mode: "0750"
  become: true

- name: Write app secret to file
  ansible.builtin.template:
    src: env.j2
    dest: /opt/app/.env
    owner: admin
    group: admin
    mode: "0600"
  become: true
