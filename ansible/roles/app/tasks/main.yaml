---
- name: Install Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Add admin user to docker group
  ansible.builtin.user:
    name: admin
    groups: docker
    append: true
  become: true

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  become: true

- name: Allow HTTP through ufw
  community.general.ufw:
    rule: allow
    port: "80"
    proto: "tcp"
  become: true

- name: Pull nginx image
  community.docker.docker_image:
    name: nginx:alpine
    source: pull
  become: true

- name: Run nginx container
  community.docker.docker_container:
    name: web-app
    image: nginx:alpine
    state: started
    restart_policy: unless-stopped
    ports:
      - "80:80"
  become: true

- name: Create app secret directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: admin
    group: admin
    mode: "0750"
  become: true

- name: Write app secret to file
  ansible.builtin.template:
    src: env.j2
    dest: /opt/app/.env
    owner: admin
    group: admin
    mode: "0600"
  become: true

- name: Allow Node Exporter metrics port through ufw
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    from_ip: "10.0.0.0/16"
  become: true

- name: Download node exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz"
    dest: /tmp/node_exporter.tar.gz
    mode: "0644"
  become: true

- name: Extract node exporter
  ansible.builtin.unarchive:
    src: /tmp/node_exporter.tar.gz
    dest: /tmp
    remote_src: true
  become: true

- name: Move node exporter binary
  ansible.builtin.copy:
    src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
  become: true

- name: Install Node Exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Start and enable Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  become: true
