---
- name: Download Grafana Alloy package
  ansible.builtin.get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ app_alloy_version }}/alloy-{{ app_alloy_version }}-1.amd64.deb"
    dest: "/tmp/alloy-{{ app_alloy_version }}-1.amd64.deb"
    mode: "0644"
  become: true

- name: Install Alloy
  ansible.builtin.apt:
    deb: "/tmp/alloy-{{ app_alloy_version }}-1.amd64.deb"
    state: present
  become: true

- name: Ensure Alloy is a member of the required log-reading groups
  ansible.builtin.user:
    name: alloy
    groups:
      - adm
      - systemd-journal
    append: true
  become: true
  notify: Restart Alloy

- name: Ensure Alloy configuration directory exists
  ansible.builtin.file:
    path: "{{ app_alloy_config_dir }}"
    state: directory
    owner: root
    group: alloy
    mode: "0750"
  become: true

- name: Ensure Alloy data directory exists
  ansible.builtin.file:
    path: "{{ app_alloy_data_dir }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"
  become: true

- name: Configure Alloy
  ansible.builtin.template:
    src: alloy.config.alloy.j2
    dest: "{{ app_alloy_config_file }}"
    owner: root
    group: alloy
    mode: "0640"
    validate: "/usr/bin/alloy validate %s"
  become: true
  notify: Restart Alloy

- name: Ensure Alloy service is running and enabled
  ansible.builtin.systemd_service:
    name: alloy
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Verify Alloy is ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:12345/-/ready"
    method: GET
    status_code: 200
  register: app_alloy_readiness
  until: app_alloy_readiness.status == 200
  retries: 12
  delay: 5
  become: true
