---
- name: Allow Node Exporter metrics from monitoring server
  community.general.ufw:
    rule: allow
    port: "{{ app_node_exporter_port }}"
    proto: tcp
    from_ip: "{{ monitoring_server_private_ip }}"
  become: true

- name: Download Node Exporter
  ansible.builtin.get_url:
    url:
      "https://github.com/prometheus/node_exporter/releases/download/v{{ app_node_exporter_version }}/\
      node_exporter-{{ app_node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ app_node_exporter_version }}.linux-amd64.tar.gz"
    mode: "0644"
  become: true

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ app_node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  become: true

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ app_node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  become: true

- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Install node exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Start and enable node exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Verify Node Exporter is reachable
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_node_exporter_port }}/metrics"
    method: GET
    status_code: 200
  register: app_node_exporter_reachability
  until: app_node_exporter_reachability.status == 200
  retries: 12
  delay: 5
  become: true
