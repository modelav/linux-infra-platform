---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  become: true

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  become: true

- name: Allow SSH from administrator CIDR
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    from_ip: "{{ allowed_ssh_cidr }}"
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true
