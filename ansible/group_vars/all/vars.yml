---
# admin_ssh_public_key: ""
# allowed_ssh_cidr: ""
automation_user: "admin"

app_server_private_ip: ""
monitoring_server_private_ip: ""

app_container_name: "web-app"
app_container_image: "nginx:1.31.4-alpine-slim"
app_container_port: "80"

app_secret_key: "{{ vault_app_secret_key }}"

# Observability versions
node_exporter_version: "1.12.1"
alloy_version: "1.19.2"
loki_version: "3.7.7"
alertmanager_version: "0.33.1"

# Observability paths
loki_data_dir: "/var/lib/loki"
alloy_data_dir: "/var/lib/alloy"
alloy_config_dir: "/etc/alloy"
alloy_config_file: "/etc/alloy/config.alloy"

# Observability ports
node_exporter_port: 9100
loki_port: 3100
prometheus_port: 9090
alertmanager_port: 9093
grafana_port: 3000

# Loki endpoint used by Alloy
loki_url: "http://{{ monitoring_server_private_ip }}:3100/loki/api/v1/push"

# Alertmanager notification
alertmanager_slack_webhook_url: "{{ vault_alertmanager_slack_webhook_url }}"
alertmanager_slack_channel: "#devops-alerts"
