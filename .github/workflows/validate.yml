name: Validate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        working-directory:
          - terraform
          - terraform/bootstrap

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Terraform format check
        working-directory: ${{ matrix.working-directory }}
        run: terraform fmt -check -recursive

      - name: Terraform init (backend disabled)
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ matrix.working-directory }}
        run: terraform validate -no-color

  ansible:
    name: Ansible lint
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core==2.19.10 \
            ansible-lint==26.6.0

      - name: Install Ansible collections
        working-directory: ansible
        run: |
          mkdir -p "${ANSIBLE_COLLECTIONS_PATH}"

          ansible-galaxy collection install \
            -r requirements.yml \
            -p "${ANSIBLE_COLLECTIONS_PATH}"

      - name: Show Ansible environment
        working-directory: ansible
        run: |
          ansible --version
          ansible-lint --version
          ansible-galaxy collection list

      - name: Verify required modules
        working-directory: ansible
        run: |
          ansible-doc ansible.posix.authorized_key
          ansible-doc community.general.ufw

      - name: Run ansible-lint
        working-directory: ansible
        run: |
          ansible-lint site.yml bootstrap.yml
