name: Terraform Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsTerraformPlan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Validate backend configuration
        run: |
          test -n "$TF_STATE_BUCKET" || {
          echo "::error::TF_STATE_BUCKET GitHub Actions variable is not configured."
          exit 1
          }

          test -n "$AWS_REGION" || {
          echo "::error::AWS_REGION GitHub Actions variable is not configured."
          exit 1
          }

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
           -backend-config="bucket=${TF_STATE_BUCKET}" \
           -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -no-color
